# Пример обратного прокси: nginx перед Perfect JSON API
#
# Возможности: TLS (Let's Encrypt), ограничение /docs, защита /metrics,
# лимит размера тела запроса. Положить в /etc/nginx/sites-available/perfectjson
# и сделать симлинк в sites-enabled, затем certbot --nginx -d api.example.com.

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Тело запроса: файлы до 25 МБ (MAX_FILE_MB=20 + запас на multipart)
    client_max_body_size 25m;

    # Общий лимит запросов (второй эшелон после RPM на API-ключи)
    limit_req zone=api_general burst=60 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Swagger/OpenAPI закрыты от интернета (только для allow-listed IP оператора)
    location /docs {
        allow 203.0.113.10;   # IP оператора
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }
    location /openapi.json {
        allow 203.0.113.10;
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }

    # /metrics наружу не отдаём: сборщик Prometheus ходит из внутренней сети
    # напрямую в контейнер, либо раскомментируйте allow/deny:
    location /metrics {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://127.0.0.1:8000;
    }

    # Админ-эндпоинты можно дополнительно ограничить по IP (первый эшелон —
    # X-Admin-Key, второй — сеть):
    location /admin {
        # allow 203.0.113.10; deny all;
        proxy_pass http://127.0.0.1:8000;
    }
}
